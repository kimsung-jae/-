plugins {
    id 'com.android.application'
}
android {
    namespace 'com.bubbleladder.triplehedge'
    compileSdk 35
    defaultConfig {
        applicationId "com.bubbleladder.triplehedge"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        stable {
            storeFile file("triplehedge-stable.jks")
            storePassword "TripleHedge2026!"
            keyAlias "triplehedge"
            keyPassword "TripleHedge2026!"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stable }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
}
