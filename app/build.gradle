plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bubbleladder.triplehedgev2'
    compileSdk 35

    defaultConfig {
        applicationId "com.bubbleladder.triplehedgev2"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.2-standalone-v2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        stable {
            storeFile file("triplehedge-stable.jks")
            storePassword "TripleHedge2026!"
            keyAlias "triplehedge"
            keyPassword "TripleHedge2026!"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.stable }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }
}
